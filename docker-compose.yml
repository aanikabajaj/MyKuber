services:
  backend:
    build: ./backend
    container_name: iaare-backend
    environment:
      IAARE_DEMO_MODE: "true"
      IAARE_RP_ID: "localhost"
      IAARE_EXPECTED_ORIGIN: "http://localhost:5173"
      IAARE_CORS_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173"
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: iaare-frontend
    depends_on:
      - backend
    ports:
      - "5173:5173"
    restart: unless-stopped
