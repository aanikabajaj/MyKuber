apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-worker
  namespace: default
  labels:
    app: celery-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: celery-worker
  template:
    metadata:
      labels:
        app: celery-worker
    spec:
      containers:
        - name: celery-worker
          image: ai-gateway:latest
          imagePullPolicy: IfNotPresent
          command:
            - "celery"
            - "-A"
            - "ai.rag.ingestion.celery_app"
            - "worker"
            - "--loglevel=info"
          envFrom:
            - secretRef:
                name: ai-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
