databases:
  # Render only allows one free-tier database per account, so the AI
  # gateway's tables (all prefixed ai_*, no collisions with the backend's)
  # live in this same database instead of a separate one.
  - name: iaare-db
    plan: free
    databaseName: iaare
    user: iaare

services:
  # --- Core banking backend (auth, transactions, security prefs) ---
  - type: web
    name: iaare-backend
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      # Shared with the AI gateway below so JWTs issued here verify
      # there too — must stay identical across both services.
      - key: IAARE_SECRET_KEY
        value: "dc953a897c2aa168bb783189c8be73771bec5be0437f4a3bb68061df0278fc0b"
      - key: IAARE_DEMO_MODE
        value: "true"
      - key: IAARE_DATABASE_URL
        fromDatabase:
          name: iaare-db
          property: connectionString
      # WebAuthn ceremonies run in the browser against the *frontend's*
      # origin, not the backend's — these must match iaare-frontend's URL.
      - key: IAARE_RP_ID
        value: "iaare-frontend.onrender.com"
      - key: IAARE_EXPECTED_ORIGIN
        value: "https://iaare-frontend.onrender.com"
      - key: IAARE_CORS_ORIGINS
        value: "https://iaare-frontend.onrender.com,http://localhost:5173,http://127.0.0.1:5173,http://localhost:8081,http://127.0.0.1:8081,http://localhost:19006,http://127.0.0.1:19006,http://10.0.2.2:8000"

  # --- Frontend: Vite/React web app, nginx-served, proxies /api and /ai ---
  - type: web
    name: iaare-frontend
    runtime: docker
    plan: free
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend

  # --- AI gateway: chat assistant, portfolio tools, RAG ---
  # Uses all-MiniLM-L6-v2 (~90MB) instead of BGE-M3 (~2GB) for RAG
  # embeddings, specifically so this fits Render's free tier. Uses the
  # SAME iaare-db Postgres as the backend (ai_*-prefixed tables, no
  # collisions), plus external Qdrant Cloud (vector store) and Upstash
  # (Redis). MinIO and a dedicated Celery worker were dropped entirely —
  # not needed for the bundled knowledge_base ingestion path.
  - type: web
    name: iaare-ai-gateway
    runtime: docker
    dockerfilePath: ./ai/Dockerfile
    dockerContext: .
    healthCheckPath: /ai/health
    plan: free
    envVars:
      - key: IAARE_SECRET_KEY
        value: "dc953a897c2aa168bb783189c8be73771bec5be0437f4a3bb68061df0278fc0b"
      - key: IAARE_DEMO_MODE
        value: "true"
      - key: IAARE_DATABASE_URL
        fromDatabase:
          name: iaare-db
          property: connectionString
      - key: AI_DATABASE_URL
        fromDatabase:
          name: iaare-db
          property: connectionString
      - key: REDIS_URL
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: VLLM_BASE_URL
        sync: false
      - key: VLLM_API_KEY
        sync: false
      - key: VLLM_MODEL
        sync: false
