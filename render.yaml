databases:
  - name: iaare-db
    plan: free
    databaseName: iaare
    user: iaare
  - name: iaare-ai-db
    plan: free
    databaseName: ai_db
    user: ai_user

services:
  # --- Core banking backend (auth, transactions, security prefs) ---
  - type: web
    name: iaare-backend
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      # Shared with the AI gateway (deployed separately on Cloud Run) so
      # JWTs issued here verify there too — must stay identical.
      - key: IAARE_SECRET_KEY
        value: "dc953a897c2aa168bb783189c8be73771bec5be0437f4a3bb68061df0278fc0b"
      - key: IAARE_DEMO_MODE
        value: "true"
      - key: IAARE_DATABASE_URL
        fromDatabase:
          name: iaare-db
          property: connectionString
      # WebAuthn ceremonies run in the browser against the *frontend's*
      # origin, not the backend's — these must match iaare-frontend's URL.
      - key: IAARE_RP_ID
        value: "iaare-frontend.onrender.com"
      - key: IAARE_EXPECTED_ORIGIN
        value: "https://iaare-frontend.onrender.com"
      - key: IAARE_CORS_ORIGINS
        value: "https://iaare-frontend.onrender.com,http://localhost:5173,http://127.0.0.1:5173,http://localhost:8081,http://127.0.0.1:8081,http://localhost:19006,http://127.0.0.1:19006,http://10.0.2.2:8000"

  # --- Frontend: Vite/React web app, nginx-served, proxies /api and /ai ---
  - type: web
    name: iaare-frontend
    runtime: docker
    plan: free
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend

# NOTE: The AI gateway now deploys to Google Cloud Run (not Render) to
# avoid Render's paid tiers for the RAM it needs. It still uses the
# iaare-ai-db Postgres above (via its *external* connection string — grab
# that from the iaare-ai-db dashboard page after this blueprint applies),
# plus external Qdrant Cloud (vector store) and Upstash (Redis). MinIO and
# a dedicated Celery worker were dropped entirely — not needed for the
# bundled knowledge_base ingestion path.
