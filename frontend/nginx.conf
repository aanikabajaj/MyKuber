server {
    listen 5173;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing — always serve index.html for client routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the backend service.
    # NOTE: for local `docker compose up`, override these two proxy_pass
    # targets back to http://backend:8000 / http://ai_gateway:8001 — the
    # onrender.com hosts below are only reachable when actually deployed.
    location /api/ {
        proxy_pass https://iaare-backend.onrender.com;
        proxy_set_header Host iaare-backend.onrender.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
    }

    # Proxy AI chat/portfolio calls to the AI gateway service.
    location /ai/ {
        proxy_pass https://iaare-ai-gateway.onrender.com;
        proxy_set_header Host iaare-ai-gateway.onrender.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
        proxy_read_timeout 120s;
    }
}
